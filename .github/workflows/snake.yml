name: generate snake

# Dispara: manualmente (workflow_dispatch) e sozinho a cada 12h (schedule)
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */12 * * *"

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # 1. Gera o SVG da cobrinha a partir do seu grid de contribuições real
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 2. Empurra o resultado pra uma branch separada chamada "output"
      #    (é essa branch que o README já referencia)
      - name: push para a branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
